version: "2"

run:
  timeout: 5m
  modules-download-mode: mod

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - revive

  settings:
    revive:
      rules:
        - name: exported
          disabled: true

formatters:
  enable:
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0