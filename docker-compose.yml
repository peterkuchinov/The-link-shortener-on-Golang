version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: link_shortener_app
    ports:
      - "8080:8080"
    environment:
      - APP_PORT=8080
      - APP_ENV=dev
      - APP_KEY=super_secret_key_32_characters_long_or_more
      - APP_DATABASE_URL=postgres://postgres:your_secure_password@postgres:5432/shortener?sslmode=disable

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  postgres:
    platform: linux/amd64
    image: postgres:16-alpine
    container_name: link_shortener_db
    environment:
      - POSTGRES_USER=postgres
      
      - POSTGRES_PASSWORD=12345
      
      - POSTGRES_DB=shortener 
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shortener"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: link_shortener_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:

networks:
  app-network:
    driver: bridge
